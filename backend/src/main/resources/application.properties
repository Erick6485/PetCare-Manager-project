# ── Servidor ─────────────────────────────────────
server.port=8080

# ── Conexión a PostgreSQL ─────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/petcare_db
spring.datasource.username=postgres
spring.datasource.password=root123
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.flyway.baseline-on-migrate=true

# ── App ───────────────────────────────────────────
spring.application.name=petcare-backend
logging.level.com.petcare=DEBUG
logging.level.org.flywaydb=INFO

# ── JWT ───────────────────────────────────────────
# Secreto HMAC: mínimo 32 caracteres (o Base64 de 32+ bytes)
jwt.secret=PetCareManagerJwtSecretKeyParaHS256Minimo32CaracteresRequeridos!!
jwt.expiration-ms=1800000

# ── Multipart / evidencias ────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
petcare.uploads-dir=uploads