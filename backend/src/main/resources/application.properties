# ── Servidor ─────────────────────────────────────
server.port=${PORT:8080}
server.address=0.0.0.0

# ── Conexión a PostgreSQL ─────────────────────────
# En Railway se usa DATABASE_URL automáticamente
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/petcare_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:santiago}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.flyway.baseline-on-migrate=true

# ── App ───────────────────────────────────────────
spring.application.name=petcare-backend
logging.level.com.petcare=INFO
logging.level.org.flywaydb=INFO

# ── JWT ───────────────────────────────────────────
# Secreto HMAC: mínimo 32 caracteres (o Base64 de 32+ bytes)
jwt.secret=${JWT_SECRET:PetCareManagerJwtSecretKeyParaHS256Minimo32CaracteresRequeridos!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# ── Multipart / evidencias ────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
petcare.uploads-dir=${UPLOADS_DIR:uploads}